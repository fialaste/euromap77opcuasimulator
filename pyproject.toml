[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emsim"
version = "1.2.0"
description = "OPC UA simulator of injection moulding machines (EUROMAP 77 over EUROMAP 83)"
requires-python = ">=3.11"
dependencies = ["asyncua>=1.1", "aiohttp>=3.9", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6"]

[project.scripts]
emsim = "emsim.app:main"

[tool.setuptools.packages.find]
include = ["emsim*"]

[tool.setuptools.package-data]
emsim = ["nodesets/*.xml", "profiles/*.yaml", "ui/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]
