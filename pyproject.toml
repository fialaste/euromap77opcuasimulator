[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e77sim"
version = "1.0.1"
description = "Euromap 77 (OPC 40077) OPC UA simulator of injection moulding machines"
requires-python = ">=3.11"
dependencies = ["asyncua>=1.1", "aiohttp>=3.9", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6"]

[project.scripts]
e77sim = "e77sim.app:main"

[tool.setuptools.packages.find]
include = ["e77sim*"]

[tool.setuptools.package-data]
e77sim = ["nodesets/*.xml", "profiles/*.yaml", "ui/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]
