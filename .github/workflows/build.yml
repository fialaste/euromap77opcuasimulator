name: Test and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Vydat release s tímto tagem (např. v1.0.0); prázdné = jen build"
        required: false
        default: ""

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      - run: python -m pytest -q

  build:
    needs: test
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --clean packaging/e77sim.spec
      - name: Smoke test of the executable
        shell: bash
        run: |
          ./dist/e77sim --version
      - uses: actions/upload-artifact@v4
        with:
          name: e77sim-${{ runner.os }}
          path: dist/e77sim*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Name the release files
        run: |
          mkdir release
          cp artifacts/e77sim-Windows/e77sim.exe "release/e77sim-$TAG-windows-x64.exe"
          cp artifacts/e77sim-Linux/e77sim "release/e77sim-$TAG-linux-x64"
          chmod +x "release/e77sim-$TAG-linux-x64"
          (cd release && sha256sum * > SHA256SUMS.txt)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: e77sim ${{ env.TAG }}
          generate_release_notes: true
          files: release/*
