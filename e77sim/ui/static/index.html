<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Euromap 77 Simulator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Ctext x='8' y='12' font-size='9' text-anchor='middle' fill='white' font-family='sans-serif'%3E77%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">Euromap 77 <span>Simulator</span></div>
  <nav id="tabs"></nav>
  <div class="fleet">
    <button id="addMachine" class="primary">+ Přidat stroj</button>
    <button id="resetMachines" title="Smaže uložené stroje a spustí výchozí">Obnovit výchozí stroje</button>
  </div>
</header>

<section id="overview" class="overview"></section>

<main>
  <aside class="tree-pane">
    <div class="tree-tools">
      <input id="search" type="search" placeholder="Hledat uzel…">
      <label class="chk"><input id="onlyAS" type="checkbox"> jen A/S</label>
    </div>
    <div id="tree" class="tree"></div>
    <div class="legend">
      <span class="badge A">A</span>analog <span class="badge S">S</span>stav <span class="badge C">C</span>čítač
      <span class="badge I">I</span>identita <span class="badge K">K</span>konfigurace <span class="badge M">M</span>metoda
    </div>
  </aside>

  <section class="editor-pane">
    <div id="editor" class="card"><p class="muted">Vyberte uzel ve stromu vlevo.</p></div>
  </section>

  <section class="side-pane">
    <div class="side-tabs" id="sideTabs">
      <button data-tab="events" class="active">Události</button>
      <button data-tab="cycle">Cyklus</button>
      <button data-tab="jobs">Zakázky</button>
      <button data-tab="datasets">Datové sady</button>
      <button data-tab="messages">Hlášení</button>
    </div>
    <div id="side" class="side"></div>
  </section>
</main>

<div id="empty" class="empty" hidden>
  <h2>Neběží žádný stroj</h2>
  <p class="muted">Přidejte stroj tlačítkem nahoře, nebo obnovte výchozí stroje.</p>
</div>

<div id="wizard" class="modal" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="wzTitle">
    <div class="wz-head">
      <h2 id="wzTitle">Přidat stroj</h2>
      <ol class="steps" id="wzSteps">
        <li data-i="0"><b>1</b> Typ stroje</li>
        <li data-i="1"><b>2</b> Datový model</li>
        <li data-i="2"><b>3</b> Shrnutí</li>
      </ol>
      <button class="small" id="wzClose" aria-label="Zavřít">✕</button>
    </div>
    <div class="wz-body" id="wzBody"></div>
    <div class="wz-foot">
      <button id="wzBack">Zpět</button>
      <button class="primary" id="wzNext">Další</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script src="/static/app.js"></script>
</body>
</html>
